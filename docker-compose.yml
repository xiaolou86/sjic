version: '3.8'

# 开发 / 首次构建镜像：docker compose build
# 现场安装与升级见 docs/初次打包与部署.md、docs/后续打包与升级.md
# Edge 侧在 edge-agent/config.yaml 配置平台地址，自行拼接模型下载基址

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sjic-backend:runtime
    container_name: sjic-backend
    restart: unless-stopped
    ports:
      - "38881:38881"
      - "38883:38883"
    volumes:
      - ./backend/instance:/app/instance
      - ./data:/app/data
      - ./alerts:/app/alerts
      - ./models:/app/models
      - ./videos:/app/videos
      - ./logs:/app/logs
      - ./branding:/app/branding
      # Linux 生产环境建议挂载，授权绑定宿主机/虚机；Windows Docker Desktop 请勿启用
      - /etc/machine-id:/host/etc/machine-id:ro
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
      - DATABASE_URL=sqlite:///instance/app.db
      - ALERT_STORAGE_PATH=/app/alerts
      - BRANDING_STORAGE_PATH=/app/branding
      - MQTT_BROKER_URL=127.0.0.1
      - MQTT_BROKER_PORT=38883
      - STORAGE_TYPE=${STORAGE_TYPE:-NGINX}
      - DOWNLOAD_SECURE_KEY=${DOWNLOAD_SECURE_KEY:-my-super-secret-key-for-nginx}
      - LICENSE_SIGNING_KEY=${LICENSE_SIGNING_KEY:-change-me-sjic-license-signing-key}
      - SJIC_IN_CONTAINER=1
      # 可选：无 machine-id 挂载时显式传入宿主机标识
      - HOST_MACHINE_ID=${HOST_MACHINE_ID:-}
    networks:
      - sjic-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sjic-frontend:runtime
    container_name: sjic-frontend
    restart: unless-stopped
    ports:
      - "38880:38880"
    volumes:
      - ./models:/usr/share/nginx/models:ro
    environment:
      - TZ=Asia/Shanghai
      - DOWNLOAD_SECURE_KEY=${DOWNLOAD_SECURE_KEY:-my-super-secret-key-for-nginx}
    depends_on:
      - backend
    networks:
      - sjic-network

networks:
  sjic-network:
    driver: bridge
