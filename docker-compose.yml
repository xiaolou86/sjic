version: '3.8'

# 私有化模型下发：backend 写 ./models，frontend Nginx 托管 /static-models（secure_link）
# Edge 侧在 edge-agent/config.yaml 配置平台地址，自行拼接模型下载基址

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sjic-backend
    restart: unless-stopped
    ports:
      - "38881:38881"
      - "38883:38883"
    volumes:
      - ./backend/instance:/app/instance
      - ./data:/app/data
      - ./alerts:/app/alerts
      - ./models:/app/models
      - ./videos:/app/videos
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
      - DATABASE_URL=sqlite:///instance/app.db
      - ALERT_STORAGE_PATH=/app/alerts
      - MQTT_BROKER_URL=127.0.0.1
      - MQTT_BROKER_PORT=38883
      - STORAGE_TYPE=${STORAGE_TYPE:-NGINX}
      - DOWNLOAD_SECURE_KEY=${DOWNLOAD_SECURE_KEY:-my-super-secret-key-for-nginx}
    networks:
      - sjic-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sjic-frontend
    restart: unless-stopped
    ports:
      - "38880:38880"
    volumes:
      - ./models:/usr/share/nginx/models:ro
    environment:
      - DOWNLOAD_SECURE_KEY=${DOWNLOAD_SECURE_KEY:-my-super-secret-key-for-nginx}
    depends_on:
      - backend
    networks:
      - sjic-network

networks:
  sjic-network:
    driver: bridge
