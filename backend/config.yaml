# ---------------------------------------------------------
# SJIC Cloud Platform Configuration
# ---------------------------------------------------------

app:
  # JWT 签名密钥。不填时首次启动随机生成，保存在 instance/secret_key；也可用环境变量 SECRET_KEY
  secret_key: ""
  
database:
  # 如果要切回 SQLite，填入 sqlite:///app.db 即可
  # 生产环境推荐：mysql+pymysql://root:123456@127.0.0.1:3306/sjic_db?charset=utf8mb4
  uri: "sqlite:///app.db"

mqtt:
  # MQTT 服务端配置 (本地开发连接 127.0.0.1，Docker Compose 会被环境变量覆盖为 mosquitto)
  broker_url: "127.0.0.1"
  broker_port: 38883

storage:
  # 端边云对象存储与模型下发配置
  # 支持: 'MINIO', 'OBS', 'NGINX'
  # 私有化推荐 NGINX：frontend 托管 /static-models；Edge 自行拼接可达基址（见 edge-agent/config.yaml）
  type: "NGINX"

  # 须与 frontend 容器环境变量 DOWNLOAD_SECURE_KEY 一致（默认值两边已对齐，一般不用改）
  download_secure_key: "my-super-secret-key-for-nginx"

  # ---------- 针对 S3/MinIO 配置 ----------
  # 访问密钥不要写在这里，用环境变量 STORAGE_ACCESS_KEY、STORAGE_SECRET_KEY 提供
  endpoint: "https://minio-api.nm.ljyun.cn"
  bucket: "dev/sjic/models"

fs:
  # 【重要隐私配置】告警产生的原始图片存放处
  # 如果为空，默认存储在 backend/alerts/
  # 私有化NAS挂载示例: "/mnt/nas/factory_alerts"
  alert_storage_path: ""

security:
  cors_origins: "*"

license:
  # 试用版默认视频路数（签发参考；实际以导入的 license 文件为准）
  trial_max_cameras: 4
  # 授权 HMAC 签名密钥（务必修改；也可用环境变量 LICENSE_SIGNING_KEY）
  signing_key: "change-me-sjic-license-signing-key"
