name: sjic-edge

# 镜像由 edge-agent/docker-compose.yml 构建为 sjic-edge:jetson，本文件只挂载应用目录。

services:
  edge-agent:
    image: sjic-edge:jetson
    container_name: sjic-edge
    restart: unless-stopped
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    runtime: nvidia
    environment:
      - TZ=Asia/Shanghai
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    volumes:
      - /opt/sjic/current/edge-agent:/app
      - /opt/sjic/edge/config.yaml:/app/config.yaml:ro
      - /opt/sjic/edge/models:/app/models
      - /opt/sjic/edge/alerts:/app/alerts
      - /opt/sjic/edge/logs:/app/logs
      - /opt/sjic/incoming:/opt/sjic/incoming
      - /opt/sjic/updater:/opt/sjic/updater:ro
