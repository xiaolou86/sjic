# SJIC Edge Agent — 盒子侧 Docker Compose
#
# Jetson（默认）:
#   1. 编辑 config.yaml：architecture=jetson，填入平台 MQTT/API 地址
#   2. docker compose build
#   3. sudo bash deploy/install-host.sh
# 日常升级走管理平台下发的安装包，见 JETSON_DEPLOY.md。不要为了升级重新构建镜像。
#   RTSP 默认走 NVDEC（nvv4l2decoder）；失败回退 avdec_h264。SJIC_RTSP_HWDEC=0 可强制软解。
#
# 远程重启 Agent：平台下发 agent/restart → 容器进程退出 → restart: unless-stopped 自动拉起
# 远程重启/关机主机：平台下发 agent/power → nsenter 宿主机 PID 1 执行 reboot/poweroff
#   因此需要 privileged + pid: host；网卡需开启 WOL 才能被平台网络唤醒
#
# x86/CPU 调试:
#   docker compose --profile x86 up -d --build

services:
  edge-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${EDGE_BASE_IMAGE:-ultralytics/ultralytics:latest-jetson-jetpack6}
        # Jetson 基础镜像已含 ultralytics/torch，只装通用依赖即可
        REQUIREMENTS_FILE: ${EDGE_REQUIREMENTS:-requirements.txt}
    image: ${EDGE_IMAGE:-sjic-edge:jetson}
    container_name: sjic-edge
    restart: unless-stopped
    # host 网络：真实 MAC / 局域网 IP、MQTT、RTSP 更稳定
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    runtime: ${EDGE_RUNTIME:-nvidia}
    environment:
      - TZ=Asia/Shanghai
      - NVIDIA_VISIBLE_DEVICES=all
      # video：打开 NVDEC，RTSP 硬解走 GPU 而不是 avdec_h264 软解
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./models:/app/models
      - ./alerts:/app/alerts
      - ./logs:/app/logs
    # 仅当主机存在 USB 摄像头时再打开；没有 /dev/video0 时 compose 会启动失败
    # devices:
    #   - /dev/video0:/dev/video0

  # PC / 无 NVIDIA runtime 时的调试镜像（CPU）
  edge-agent-x86:
    profiles: ["x86"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${EDGE_BASE_IMAGE_X86:-python:3.10-slim}
        REQUIREMENTS_FILE: requirements-cpu.txt
    image: sjic-edge:x86
    container_name: sjic-edge
    restart: unless-stopped
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./models:/app/models
      - ./alerts:/app/alerts
      - ./logs:/app/logs
