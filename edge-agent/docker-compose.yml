# SJIC Edge Agent — 盒子侧 Docker Compose
#
# 构建机（有源码的那台 Jetson）:
#   1. docker compose build
#   2. docker save -o sjic-edge-jetson.tar sjic-edge:jetson
# 构建时编译为 .pyc 并删除 .py，镜像里不留源码。
# 客户盒子不放源码，安装见 docs/初次打包与部署.md。日常升级走管理平台下发的安装包。
#   RTSP 硬解：镜像装了 GStreamer + PyGObject，容器里有 nvv4l2decoder 时走 NVDEC，
#   否则回退 FFmpeg 软解。日志 "Opened RTSP via ..." 写明实际后端；现场核对：
#   docker exec sjic-edge python -m utils.stream_check "<rtsp地址>" --fps 5
#   SJIC_RTSP_HWDEC=0 可禁用 GStreamer 硬解候选。
#
# 远程重启 Agent：平台下发 agent/restart → 容器进程退出 → restart: unless-stopped 自动拉起
# 远程重启/关机主机：平台下发 agent/power → nsenter 宿主机 PID 1 执行 reboot/poweroff
#   因此需要 privileged + pid: host；网卡需开启 WOL 才能被平台网络唤醒
#
# x86/CPU 调试:
#   docker compose --profile x86 up -d --build

services:
  edge-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${EDGE_BASE_IMAGE:-ultralytics/ultralytics:latest-jetson-jetpack6}
        # Jetson 基础镜像已含 ultralytics/torch，只装通用依赖即可
        REQUIREMENTS_FILE: ${EDGE_REQUIREMENTS:-requirements.txt}
    image: ${EDGE_IMAGE:-sjic-edge:jetson}
    container_name: sjic-edge
    restart: unless-stopped
    # host 网络：真实 MAC / 局域网 IP、MQTT、RTSP 更稳定
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    runtime: ${EDGE_RUNTIME:-nvidia}
    environment:
      - TZ=Asia/Shanghai
      - NVIDIA_VISIBLE_DEVICES=all
      # video：打开 NVDEC，RTSP 硬解走 GPU 而不是 avdec_h264 软解
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./models:/app/models
      - ./alerts:/app/alerts
      - ./logs:/app/logs
    # 仅当主机存在 USB 摄像头时再打开；没有 /dev/video0 时 compose 会启动失败
    # devices:
    #   - /dev/video0:/dev/video0

  # PC / 无 NVIDIA runtime 时的调试镜像（CPU）
  edge-agent-x86:
    profiles: ["x86"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${EDGE_BASE_IMAGE_X86:-python:3.10-slim}
        REQUIREMENTS_FILE: requirements-cpu.txt
        INSTALL_GSTREAMER: "0"
    image: sjic-edge:x86
    container_name: sjic-edge
    restart: unless-stopped
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./models:/app/models
      - ./alerts:/app/alerts
      - ./logs:/app/logs
